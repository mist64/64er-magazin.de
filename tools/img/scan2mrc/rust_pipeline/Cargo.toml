[package]
name = "mrcpipe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mrcpipe"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tiff = "0.9"
rustfft = "6"
ndarray = "0.16"
ndarray-npy = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
anyhow = "1"
num-complex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
